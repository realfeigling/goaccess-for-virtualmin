name: Publish module source

on:
  push:
    paths:
      - 'goaccess-for-virtualmin-v1.4.4.wbm.gz'
      - '.github/workflows/publish-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Webmin module source
        run: |
          rm -rf src/virtualmin-goaccess
          mkdir -p src
          tar -xzf goaccess-for-virtualmin-v1.4.4.wbm.gz -C src
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/virtualmin-goaccess
          if git diff --cached --quiet; then
            echo "Source already up to date"
            exit 0
          fi
          git commit -m "Publish v1.4.4 module source"
          git push
